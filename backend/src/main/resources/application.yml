spring:
  application:
    name: reading-api
  # No credential defaults here, deliberately. A fallback in the base configuration
  # applies everywhere, including production, where a missing environment variable would
  # silently become a known password instead of a startup failure. Local defaults live in
  # application-local.yml, and `local` is only the default profile when none is set.
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Managed Postgres and connection poolers cap concurrent connections far below a
      # JDBC pool's default appetite, and a pooler hands out a fixed number of server
      # connections per client. Ten is plenty for one small instance and leaves room for
      # the ingest task to connect alongside it.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Below the typical 30s idle timeout of a pooler, so the pool retires a connection
      # before the pooler does and callers never meet a half-closed socket.
      max-lifetime: 240000
      idle-timeout: 120000
      connection-timeout: 20000
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  session:
    # Sessions live in PostgreSQL so they survive a restart. The deployment target
    # scales to zero, and in-memory sessions would sign every reader out on each cold
    # start. No new infrastructure: the database is already there. See ADR 0008.
    store-type: jdbc
    jdbc:
      # Flyway owns the schema (V4). Spring Session must not create its own tables.
      initialize-schema: never
    timeout: 30d

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  # The single browser origin permitted to send credentialed requests.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  # Cover derivatives written by the ingest task, served under /covers/**.
  cover-dir: ${COVER_DIR:./data/covers}
  session:
    # Applied by SessionCookieConfig. Spring Session ignores server.servlet.session.*,
    # so these must not be set there or they are silently dropped.
    cookie-name: GRSESSION
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

management:
  # Only health is exposed. Nothing else — env, configprops, beans, mappings and
  # heapdump all leak configuration or internals and none of them belong on a public
  # port. The host needs a liveness/readiness probe and nothing more.
  endpoints.web.exposure.include: health
  endpoints.web.discovery.enabled: false
  endpoint.health:
    probes.enabled: true
    # Unauthenticated callers get UP/DOWN. Component detail (database URLs, disk paths)
    # is not public.
    show-details: never
    show-components: never
  health.db.enabled: true
  info.env.enabled: false

logging:
  level:
    root: INFO
    dev.jorisvrr.reading: DEBUG
