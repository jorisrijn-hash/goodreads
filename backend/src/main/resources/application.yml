spring:
  application:
    name: reading-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goodreads}
    username: ${DATABASE_USER:goodreads}
    password: ${DATABASE_PASSWORD:goodreads_dev}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints.web.exposure.include: health,info
  endpoint.health:
    probes.enabled: true
    show-details: when-authorized
  health.db.enabled: true

logging:
  level:
    root: INFO
    dev.jorisvrr.reading: DEBUG
