spring:
  application:
    name: reading-api
  # No credential defaults here, deliberately. A fallback in the base configuration
  # applies everywhere, including production, where a missing environment variable would
  # silently become a known password instead of a startup failure. Local defaults live in
  # application-local.yml, and `local` is only the default profile when none is set.
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Sized for Supavisor SESSION mode (port 5432), where every client connection holds
      # a DEDICATED Postgres backend connection for its whole lifetime — connections are
      # not shared between clients as they are in transaction mode.
      #
      # The binding constraint is therefore not Supavisor's ~200 client-connection limit
      # but its pool size: roughly 15-20 backend connections on Nano, shared across both
      # the session and transaction ports. Every connection we hold is one another client
      # (or the ingest task) cannot have.
      #
      # Four is deliberate, not a default. One Render Free instance has 0.1 CPU and cannot
      # usefully serve ten concurrent database-bound requests, portfolio traffic is low,
      # and this leaves most of the backend budget free for the ingest task and headroom.
      # Verified: under 30 concurrent searches the pool opened exactly 4 connections.
      maximum-pool-size: ${DB_POOL_SIZE:4}

      # Let the pool shrink when idle. HikariCP normally recommends a fixed-size pool, but
      # that advice assumes connections are cheap; in session mode an idle connection
      # occupies a scarce backend slot for nothing.
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

      # Supavisor closes a connection that has been unused for 5 minutes. Retiring our own
      # idle connections at 2 minutes means we release them first and never discover a
      # connection the pooler has already closed underneath us.
      idle-timeout: 120000

      # Total age ceiling, comfortably under the same 5-minute window. HikariCP's guidance
      # is to keep this below any infrastructure-imposed connection lifetime.
      max-lifetime: 240000

      # keepalive is deliberately left disabled. It exists to hold idle connections open,
      # which is the opposite of what we want here: idle-timeout already retires them well
      # before the pooler would, and keeping them alive would pin backend slots we are not
      # using.

      # A request that cannot get a connection within 20s should fail rather than queue.
      # Supavisor itself queues session-mode clients for up to a minute, so waiting longer
      # only stacks latency on top of latency.
      connection-timeout: 20000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  session:
    # Sessions live in PostgreSQL so they survive a restart. The deployment target
    # scales to zero, and in-memory sessions would sign every reader out on each cold
    # start. No new infrastructure: the database is already there. See ADR 0008.
    store-type: jdbc
    jdbc:
      # Flyway owns the schema (V4). Spring Session must not create its own tables.
      initialize-schema: never
    timeout: 30d

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  # The single browser origin permitted to send credentialed requests.
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  # Cover derivatives written by the ingest task, served under /covers/**.
  cover-dir: ${COVER_DIR:./data/covers}
  session:
    # Applied by SessionCookieConfig. Spring Session ignores server.servlet.session.*,
    # so these must not be set there or they are silently dropped.
    cookie-name: GRSESSION
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

management:
  # Only health is exposed. Nothing else — env, configprops, beans, mappings and
  # heapdump all leak configuration or internals and none of them belong on a public
  # port. The host needs a liveness/readiness probe and nothing more.
  endpoints.web.exposure.include: health
  endpoints.web.discovery.enabled: false
  endpoint.health:
    probes.enabled: true
    # Unauthenticated callers get UP/DOWN. Component detail (database URLs, disk paths)
    # is not public.
    show-details: never
    show-components: never
  health.db.enabled: true
  info.env.enabled: false

logging:
  level:
    root: INFO
    dev.jorisvrr.reading: DEBUG
